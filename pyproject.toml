[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vop_poc_nz"
version = "0.2.2"
requires-python = ">=3.14"
description = "Distributional cost-effectiveness analysis framework for Aotearoa New Zealand"
readme = "README.md"
authors = [{name = "Research Team"}]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
]
dependencies = [
    "numpy>=2.5.1,<3",
    "pandas>=3.0.3,<4",
    "scipy>=1.18.0,<2",
    "scikit-learn>=1.9.0,<2",
    "matplotlib>=3.11.1,<4",
    "seaborn>=0.13.2,<1",
    "statsmodels>=0.14.6,<1",
    "Jinja2>=3.1.6,<4",
    "tabulate>=0.10.0,<1",
    "pandera>=0.32.1,<1",
    "pydantic>=2.13.4,<3",
    "PyYAML>=6.0.3,<7",
    "pyarrow>=25.0.0,<26",
    "polars>=1.42.1,<2",
    "psutil>=7.2.2,<8",
]

[project.scripts]
vop-poc-nz = "vop_poc_nz.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.22,<1",
    "mypy>=2.3.0,<3",
    "basedpyright>=1.39.9,<2",
    "hypothesis>=6.156.9,<7",
    "pre-commit>=4.6.0,<5",
    "deptry>=0.25.1,<1",
    "vulture>=2.16,<3",
    "tox>=4.57.0,<5",
]
reporting = ["great-tables>=0.22.0,<0.23"]
experimental = [
    "duckdb>=1.5.4,<2",
    "orjson>=3.11.9,<4",
    "msgspec>=0.21.1,<1",
    "scalene>=2.3.0,<3",
    "jax>=0.11.0,<0.12",
    "numpyro>=0.21.0,<0.22",
]

[project.urls]
Homepage = "https://github.com/edithatogo/vop_poc_nz"
Repository = "https://github.com/edithatogo/vop_poc_nz"

[tool.hatch.build.targets.wheel]
packages = ["src/vop_poc_nz"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/.venv_ci_sim",
  "/.venv_repro",
  "/.tox",
  "/output",
  "/data",
  "/.qoder",
  "/.snakemake",
  "/.benchmarks",
]

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[tool.uv]
# uv uses the same dependency definitions from pyproject; no additional config needed.

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    "notebooks/*.ipynb",
    "notebooks/**/*.ipynb",
    "htmlcov",
    "output",
    "data",
    "test_output",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "SIM",
    "PGH",
    "RUF",
]
extend-ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["vop_poc_nz", "src"]
known-third-party = ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "statsmodels", "sklearn"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/main_analysis.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = [
    "^__init__\\.py$",
    "^src/__init__\\.py$",
    "notebooks",
    "data",
    "output",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "generate_presentation\\.py",
    "format_references\\.py",
]
explicit_package_bases = true

[tool.deptry]
known_first_party = ["vop_poc_nz", "src"]
exclude = [
    "notebooks",
    "tests",
    "docs"
]

[tool.deptry.per_rule_ignores]
DEP002 = ["scikit-learn", "seaborn", "statsmodels", "tox", "mutmut", "deptry", "vulture", "memray", "viztracer", "pytest", "pytest-cov", "ruff", "mypy", "pyright", "pydantic", "pandera", "hypothesis", "pre-commit", "great-tables"]
DEP001 = ["src"]

[tool.vulture]
exclude = ["notebooks", "tests", "output", "build", "dist", ".venv"]
ignore_decorators = ["@pytest.fixture"]
ignore_names = ["visit_*", "do_*"]
min_confidence = 80
paths = ["src"]
sort_by_size = true
verbose = false
