name: Standalone contract bundle private-draft staging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified tag vop-voiage-contracts-vX.Y.Z
        required: true
        type: string
      bundle_sha256:
        description: Exact canonical bundle digest under review
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    name: Build content-addressed standalone bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Validate exact signed remote bundle tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^vop-voiage-contracts-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          remote_oid="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          test "$remote_oid" = "$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test -n "$APPROVED_TAGGER_EMAIL"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$remote_oid" > tag-verification.json
          jq -e '.verification.verified == true' tag-verification.json >/dev/null
          jq -e --arg tag "$RELEASE_TAG" '.tag == $tag and .object.type == "commit"' tag-verification.json >/dev/null
          test "$(jq -r '.tagger.email' tag-verification.json)" = "$APPROVED_TAGGER_EMAIL"
          printf '%s\n' "$remote_oid" > tag-object-oid.txt
          jq -r '.object.sha' tag-verification.json > tag-target-commit.txt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Install locked staging environment
        run: uv sync --frozen --extra dev
      - name: Verify and stage exact contract bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vop-voiage-contracts-v}"
          uv run --frozen python scripts/generate_contract_bundle.py --check --output "contracts/vop-voiage/$version"
          uv run --frozen python scripts/stage_contract_bundle.py \
            --bundle "contracts/vop-voiage/$version" \
            --output bundle-stage \
            --release-tag "$RELEASE_TAG" \
            --source-revision "$(git rev-parse HEAD)" \
            --bundle-sha256 "$BUNDLE_SHA256" \
            --tag-object-oid "$(cat tag-object-oid.txt)" \
            --tag-target-commit "$(cat tag-target-commit.txt)" \
            --tag-verification tag-verification.json
          jq -e '.authorization.publication_authorized == false and .authorization.signing_authorized == false' bundle-stage/stage-manifest.json >/dev/null
      - name: Attest exact archive provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: bundle-stage/*.tar.gz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: bundle-stage/provenance-predicate.json
      - name: Attest exact archive SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: bundle-stage/*.tar.gz
          sbom-path: bundle-stage/sbom.cdx.json
      - name: Retain exact private staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-contract-bundle-stage
          path: bundle-stage/
          if-no-files-found: error
          retention-days: 90

  private-draft:
    name: Create or refresh private draft only
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-contract-bundle-stage
          path: bundle-stage/
      - name: Recheck publication remains unauthorized
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg tag "$RELEASE_TAG" \
            '.publication_state == "private_draft_staging_only"
             and .authorization.publication_authorized == false
             and .source.tag == $tag' \
            bundle-stage/stage-manifest.json >/dev/null
          while read -r asset digest; do
            test "$(sha256sum "bundle-stage/$asset" | cut -d' ' -f1)" = "$digest"
          done < <(jq -r '.release_assets[] | [.path, .sha256] | @tsv' bundle-stage/stage-manifest.json)
      - name: Revalidate exact remote tag at the write boundary
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          expected_oid="$(jq -r '.source.tag_object_oid' bundle-stage/stage-manifest.json)"
          expected_commit="$(jq -r '.source.tag_target_commit' bundle-stage/stage-manifest.json)"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG" > live-tag-ref.json
          test "$(jq -r '.object.type' live-tag-ref.json)" = tag
          test "$(jq -r '.object.sha' live-tag-ref.json)" = "$expected_oid"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$expected_oid" > live-tag-verification.json
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$expected_commit" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .verification.verified == true' \
            live-tag-verification.json >/dev/null
          test "$(jq -r '.tagger.email' live-tag-verification.json)" = "$APPROVED_TAGGER_EMAIL"
      - name: Create or refresh private draft and upload exact evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --verify-tag
          fi
          jq -r '.release_assets[].path' bundle-stage/stage-manifest.json > expected-assets.txt
          printf '%s\n' stage-manifest.json >> expected-assets.txt
          sort -u expected-assets.txt -o expected-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort -u > existing-assets.txt
          if test -s existing-assets.txt; then
            test -z "$(comm -23 existing-assets.txt expected-assets.txt)"
          fi
          while read -r asset; do
            gh release upload "$RELEASE_TAG" "bundle-stage/$asset" --clobber
          done < expected-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort -u > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt
