name: Standalone contract bundle private-draft staging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified tag vop-voiage-contracts-vX.Y.Z
        required: true
        type: string
      bundle_sha256:
        description: Exact canonical bundle digest under review
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    name: Build content-addressed standalone bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Validate exact signed remote bundle tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^vop-voiage-contracts-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          remote_oid="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          test "$remote_oid" = "$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test -n "$APPROVED_TAGGER_EMAIL"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$remote_oid" > tag-verification.json
          jq -e '.verification.verified == true' tag-verification.json >/dev/null
          test "$(jq -r '.tagger.email' tag-verification.json)" = "$APPROVED_TAGGER_EMAIL"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Install locked staging environment
        run: uv sync --frozen --extra dev
      - name: Verify and stage exact contract bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vop-voiage-contracts-v}"
          uv run --frozen python scripts/generate_contract_bundle.py --check --output "contracts/vop-voiage/$version"
          uv run --frozen python scripts/stage_contract_bundle.py \
            --bundle "contracts/vop-voiage/$version" \
            --output bundle-stage \
            --release-tag "$RELEASE_TAG" \
            --source-revision "$(git rev-parse HEAD)" \
            --bundle-sha256 "$BUNDLE_SHA256"
          mv tag-verification.json bundle-stage/tag-verification.json
          jq -e '.authorization.publication_authorized == false and .authorization.signing_authorized == false' bundle-stage/stage-manifest.json >/dev/null
      - name: Attest exact archive provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: bundle-stage/*.tar.gz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: bundle-stage/provenance-predicate.json
      - name: Attest exact archive SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: bundle-stage/*.tar.gz
          sbom-path: bundle-stage/sbom.cdx.json
      - name: Retain exact private staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-contract-bundle-stage
          path: bundle-stage/
          if-no-files-found: error
          retention-days: 90

  private-draft:
    name: Create or refresh private draft only
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-contract-bundle-stage
          path: bundle-stage/
      - name: Recheck publication remains unauthorized
        run: >-
          jq -e '.publication_state == "private_draft_staging_only"
          and .authorization.publication_authorized == false'
          bundle-stage/stage-manifest.json >/dev/null
      - name: Create or refresh private draft and upload exact evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --verify-tag
          fi
          gh release upload "$RELEASE_TAG" bundle-stage/* --clobber
