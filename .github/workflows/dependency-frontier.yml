name: Dependency frontier

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Verify lockfile and install audit environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev
      - name: Compare direct dependencies with official PyPI releases
        run: uv run python scripts/dependency_frontier.py . --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-frontier
          path: |
            .conductor/local/dependency_frontier.json
            .conductor/local/dependency_frontier.md
          if-no-files-found: warn
