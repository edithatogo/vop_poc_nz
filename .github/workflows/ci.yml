
name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      with:
        version: "0.11.29"
    - name: Install qualified test dependencies
      run: uv sync --locked --extra dev
    - name: Record serialization writer identity
      run: |
        uv run --no-sync python -c "import pyarrow as pa, pyarrow.parquet as pq; print('installed pyarrow:', pa.__version__); print('committed fixture writer:', pq.read_metadata('contracts/vop-voiage/1.0.0/fixtures/typed-pipeline-records.parquet').created_by)"
    - name: Test the complete suite
      run: uv run --no-sync python -m pytest tests
    - name: Retain supported static analysis checks
      if: matrix.python-version == '3.14'
      run: |
        uv run --no-sync ruff check src/vop_poc_nz/perspective_io.py tests/test_perspective_io.py scripts/dependency_frontier.py
        uv run --no-sync vulture src/vop_poc_nz/perspective_io.py --min-confidence 90

  quality-ratchets:
    runs-on: ubuntu-latest
    env:
      BLIS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Enforce Ruff debt ratchet
        run: uv run python scripts/lint_ratchet.py
      - name: Validate shared VOP-VOIAGE compatibility contract
        run: uv run python scripts/validate_compatibility_contract.py
      - name: Enforce Arrow serialization regression budgets
        run: >-
          uv run python scripts/serialization_benchmark.py
          --output .benchmarks/serialization.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: serialization-benchmark
          path: .benchmarks/serialization.json
          if-no-files-found: error
          include-hidden-files: true

  free-threaded-observation:
    name: Python 3.14t observation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14t"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - name: Exercise minimal free-threaded Arrow boundary
        id: free_threaded_probe
        continue-on-error: true
        run: >-
          uv run --no-project --no-build
          --with pyarrow==25.0.0
          --with polars==1.42.1
          python scripts/free_threaded_arrow_probe.py
      - name: Record ecosystem readiness
        if: steps.free_threaded_probe.outcome != 'success'
        run: |
          echo "::notice::Python 3.14t Arrow wheels are not yet available for this probe."
          echo "Python 3.14t Arrow compatibility is currently observational." >> "$GITHUB_STEP_SUMMARY"

