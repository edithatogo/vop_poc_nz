name: Manuscript build

on:
  pull_request:
    paths:
      - "manuscript/**"
      - "scripts/build_manuscript.ps1"
      - "scripts/regenerate_manuscript_results.py"
      - "scripts/systematic_software_review.py"
      - "src/vop_poc_nz/parameters.yaml"
      - ".github/workflows/manuscript-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify manifest-backed analytical and review artifacts
        shell: bash
        run: |
          uv sync --locked
          uv run python scripts/regenerate_manuscript_results.py --verify
          uv run python scripts/systematic_software_review.py --verify
          uv run pytest tests/test_manuscript_regeneration.py tests/test_systematic_software_review.py -q
      - name: Compile arXiv and JSS manuscripts with TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            jss_submission.tex
            jss_journal.tex
          working_directory: manuscript
          args: -interaction=nonstopmode -file-line-error
      - name: Inspect PDF metadata and retain artifact
        uses: actions/upload-artifact@v4
        with:
          name: vop-poc-nz-manuscript
          path: |
            manuscript/jss_submission.pdf
            manuscript/jss_journal.pdf
          if-no-files-found: error
      - name: Prepare fail-closed arXiv source bundle
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vop-arxiv-package"
          python scripts/prepare_arxiv_submission.py \
            --source manuscript \
            --output "$RUNNER_TEMP/vop-arxiv-package" \
            --manifest "$RUNNER_TEMP/vop-arxiv-manifest.json"
          cp "$RUNNER_TEMP/vop-arxiv-manifest.json" "$RUNNER_TEMP/vop-arxiv-package/submission-manifest.json"
          tar -czf "$RUNNER_TEMP/vop-arxiv-source.tar.gz" -C "$RUNNER_TEMP/vop-arxiv-package" .
      - name: Upload arXiv source bundle
        uses: actions/upload-artifact@v4
        with:
          name: vop-poc-nz-arxiv-source
          path: ${{ runner.temp }}/vop-arxiv-source.tar.gz
          if-no-files-found: error
      - name: Checkout pinned Sourceright tool (CI-only)
        uses: actions/checkout@v4
        with:
          repository: edithatogo/sourceright
          ref: dde39b3bb334f79f12e395a5317b21e036336bdd
          path: .ci-tools/sourceright
      - name: Verify Sourceright arXiv package boundary
        shell: pwsh
        working-directory: .ci-tools/sourceright
        run: ./scripts/verify-arxiv-package.ps1
      - name: Checkout pinned AuthenText tool (CI-only)
        uses: actions/checkout@v4
        with:
          repository: edithatogo/authentext
          ref: 7f70dad5b6deab1af92faf037ef2638e7f3aea05
          path: .ci-tools/authentext
      - name: Run AuthenText editorial workflow tests
        working-directory: .ci-tools/authentext
        run: npm ci --ignore-scripts && npm test
