name: Manuscript build

on:
  pull_request:
    paths: ["manuscript/**", "scripts/build_manuscript.ps1", ".github/workflows/manuscript-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with TeX Live and biber
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/jss_submission.tex
          working_directory: manuscript
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -file-line-error
      - name: Inspect PDF metadata and retain artifact
        uses: actions/upload-artifact@v4
        with:
          name: vop-poc-nz-manuscript
          path: manuscript/jss_submission.pdf
          if-no-files-found: error
      - name: Checkout pinned Sourceright tool (CI-only)
        uses: actions/checkout@v4
        with:
          repository: edithatogo/sourceright
          ref: dde39b3bb334f79f12e395a5317b21e036336bdd
          path: .ci-tools/sourceright
      - name: Verify Sourceright arXiv package boundary
        shell: pwsh
        working-directory: .ci-tools/sourceright
        run: ./scripts/verify-arxiv-package.ps1
      - name: Checkout pinned AuthenText tool (CI-only)
        uses: actions/checkout@v4
        with:
          repository: edithatogo/authentext
          ref: 7f70dad5b6deab1af92faf037ef2638e7f3aea05
          path: .ci-tools/authentext
      - name: Run AuthenText editorial workflow tests
        working-directory: .ci-tools/authentext
        run: npm ci --ignore-scripts && npm test
