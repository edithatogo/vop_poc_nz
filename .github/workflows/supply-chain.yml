name: Supply-chain assurance

on:
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install locked assurance environment
        run: uv sync --frozen --extra dev
      - name: Verify reproducible distributions
        run: uv run python scripts/reproducible_build.py . --output .assurance/reproducible-build.json --dist-dir .assurance/dist
      - name: Generate CycloneDX SBOM
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .assurance/release-requirements.txt
          uv venv .assurance/sbom-env --python 3.14
          uv pip install --python .assurance/sbom-env/bin/python --require-hashes -r .assurance/release-requirements.txt
          uv pip install --python .assurance/sbom-env/bin/python --no-deps .assurance/dist/*.whl
          uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment .assurance/sbom-env --pyproject pyproject.toml --mc-type library --output-reproducible --of JSON -o .assurance/sbom.cdx.json
      - name: Retain vulnerability evidence
        run: |
          audit_status=0
          uv run --no-sync pip-audit -r .assurance/release-requirements.txt --format=json --output=.assurance/pip-audit.json || audit_status=$?
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.assurance/pip-audit.json')
          if not path.is_file():
              raise SystemExit('Audit produced no JSON evidence; the gate remains failed.')
          report = json.loads(path.read_text(encoding='utf-8'))
          for dependency in report.get('dependencies', []):
              vulnerabilities = dependency.get('vulns', [])
              if vulnerabilities:
                  print(json.dumps({
                      'name': dependency['name'],
                      'version': dependency['version'],
                      'vulnerabilities': [
                          {'id': item['id'], 'fix_versions': item.get('fix_versions', [])}
                          for item in vulnerabilities
                      ],
                  }, sort_keys=True))
          PY
          exit "$audit_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supply-chain-assurance
          path: |
            .assurance/*.json
            .assurance/*.txt
            .assurance/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
