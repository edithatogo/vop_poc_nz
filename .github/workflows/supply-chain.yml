name: Supply-chain assurance

on:
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install locked assurance environment
        run: uv sync --frozen --extra dev
      - name: Verify reproducible distributions
        run: uv run python scripts/reproducible_build.py . --output .assurance/reproducible-build.json
      - name: Generate CycloneDX SBOM
        run: uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment --of JSON -o .assurance/sbom.cdx.json
      - name: Retain vulnerability evidence
        run: uv run pip-audit --format=json --output=.assurance/pip-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supply-chain-assurance
          path: .assurance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
